name: CI Secrets

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # scan the whole history, not only the last commit

      # WHY: the gitleaks binary (Docker image, pinned) instead of gitleaks-action, which
      # needs a paid license for organization accounts.
      - name: Scan history for API keys and tokens
        run: >
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.2
          git /repo --no-banner --redact --config /repo/.gitleaks.toml
