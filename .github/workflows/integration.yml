name: Integration (real APIs)

# WHY manual only: every run calls the paid OpenAI and Anthropic APIs (well under
# 1 EUR per run). Switch to a nightly schedule once the budget allows it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Real API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras --dev
      - run: uv run pytest -m integration --no-cov -v
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-report
          path: benchmarks/results/*-integration.md
          if-no-files-found: ignore
