name: CLA

# Asks every new contributor to sign CLA.md once (by commenting on their pull request).
# Signatures are stored in signatures/cla.json on the `cla-signatures` branch.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions: {}

jobs:
  cla:
    name: CLA signature
    runs-on: ubuntu-latest
    # Write access only for this job, which never runs contributor code. contents: write
    # stores the signatures on the cla-signatures branch.
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    if: >
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # WHY: this action never checks out or runs the contributor's code, so using
      # pull_request_target (which has write access) is safe here.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: "https://github.com/${{ github.repository }}/blob/main/CLA.md"
          path-to-signatures: "signatures/cla.json"
          branch: "cla-signatures"
          allowlist: "kanazoeissouf83-ops,dependabot[bot],github-actions[bot]"
          custom-notsigned-prcomment: >
            Thank you for your contribution! Before we can merge it, please read our
            [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            and sign it by replying to this pull request with the sentence below.
            You only need to do this once.
          custom-allsigned-prcomment: "All contributors have signed the CLA. Thank you!"
