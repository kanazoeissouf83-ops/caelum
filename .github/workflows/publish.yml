name: Publish to PyPI

# Manual only. Uses PyPI "trusted publishing" (no API token stored in GitHub): configure a
# trusted publisher for the project "caelum-ai" on test.pypi.org / pypi.org with this
# repository, workflow "publish.yml" and the environment named below.
on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Target index"
        required: true
        default: pypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.10"
      - run: uv sync --locked --all-extras --dev
      - run: uv run pytest --no-cov -q
      - run: uv build
      - run: uvx twine check dist/*
      - name: Smoke test the wheel in a clean virtualenv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install -q "$(ls dist/*.whl)[openai]"
          /tmp/smoke/bin/python ../../ops/smoke_test.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: packages/python/dist/

  publish:
    name: Publish to ${{ inputs.repository }}
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.repository }}
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: ${{ inputs.repository == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
